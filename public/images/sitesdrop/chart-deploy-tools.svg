<svg viewBox="0 0 560 320" width="560" height="320" role="img" aria-labelledby="c3t c3d" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,-apple-system,Segoe UI,sans-serif">
<title id="c3t">Share of developers using each deployment tool in 2025</title>
<desc id="c3d">Horizontal bar chart. Docker 71.1 percent, AWS 43.3 percent, Kubernetes 28.5 percent, Cloudflare 20.1 percent, Vercel 10.6 percent, Netlify 5.9 percent of all respondents to the Stack Overflow Developer Survey 2025.</desc>
<rect width="560" height="320" fill="#0A2434"/>
<text x="24" y="28" font-size="14" font-weight="600" fill="#FFFFFF">Where developers already deploy</text>
<text x="24" y="46" font-size="11" fill="#B7CCD5">Share of all respondents, two survey questions, Stack Overflow Developer Survey 2025</text>
<line x1="110.0" x2="110.0" y1="60" y2="282" stroke="rgba(255,255,255,0.35)" stroke-width="1"/><text x="110.0" y="298" font-size="10" text-anchor="middle" fill="#B7CCD5">0%</text>
<line x1="207.5" x2="207.5" y1="60" y2="282" stroke="rgba(255,255,255,0.14)" stroke-width="1"/><text x="207.5" y="298" font-size="10" text-anchor="middle" fill="#B7CCD5">20%</text>
<line x1="305.0" x2="305.0" y1="60" y2="282" stroke="rgba(255,255,255,0.14)" stroke-width="1"/><text x="305.0" y="298" font-size="10" text-anchor="middle" fill="#B7CCD5">40%</text>
<line x1="402.5" x2="402.5" y1="60" y2="282" stroke="rgba(255,255,255,0.14)" stroke-width="1"/><text x="402.5" y="298" font-size="10" text-anchor="middle" fill="#B7CCD5">60%</text>
<line x1="500.0" x2="500.0" y1="60" y2="282" stroke="rgba(255,255,255,0.14)" stroke-width="1"/><text x="500.0" y="298" font-size="10" text-anchor="middle" fill="#B7CCD5">80%</text>
<text x="100" y="82.0" font-size="12" text-anchor="end" fill="#FFFFFF">Docker</text>
<rect x="110" y="66" width="346.6" height="24" rx="4" fill="#8FAAB5"/>
<text x="464.6" y="82.0" font-size="12" fill="#FFFFFF">71.1%</text>
<text x="100" y="118.0" font-size="12" text-anchor="end" fill="#FFFFFF">AWS</text>
<rect x="110" y="102" width="211.1" height="24" rx="4" fill="#8FAAB5"/>
<text x="329.1" y="118.0" font-size="12" fill="#FFFFFF">43.3%</text>
<text x="100" y="154.0" font-size="12" text-anchor="end" fill="#FFFFFF">Kubernetes</text>
<rect x="110" y="138" width="138.9" height="24" rx="4" fill="#8FAAB5"/>
<text x="256.9" y="154.0" font-size="12" fill="#FFFFFF">28.5%</text>
<text x="100" y="190.0" font-size="12" text-anchor="end" fill="#FFFFFF">Cloudflare</text>
<rect x="110" y="174" width="98.0" height="24" rx="4" fill="#8FAAB5"/>
<text x="216.0" y="190.0" font-size="12" fill="#FFFFFF">20.1%</text>
<text x="100" y="226.0" font-size="12" text-anchor="end" fill="#FFFFFF">Vercel</text>
<rect x="110" y="210" width="51.7" height="24" rx="4" fill="#8FAAB5"/>
<text x="169.7" y="226.0" font-size="12" fill="#FFFFFF">10.6%</text>
<text x="100" y="262.0" font-size="12" text-anchor="end" fill="#FFFFFF">Netlify</text>
<rect x="110" y="246" width="28.8" height="24" rx="4" fill="#8FAAB5"/>
<text x="146.8" y="262.0" font-size="12" fill="#FFFFFF">5.9%</text>
<text x="24" y="306" font-size="10" fill="#B7CCD5">Source: Stack Overflow Developer Survey 2025, Technology section, all respondents (July 2025)</text>
</svg>