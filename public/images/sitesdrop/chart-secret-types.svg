<svg viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="c1t c1d" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,-apple-system,Segoe UI,sans-serif">
<title id="c1t">Generic versus specific secrets leaked on public GitHub in 2024</title>
<desc id="c1d">Donut chart. Of the 23.8 million secrets GitGuardian found on public GitHub in 2024, 58 percent were generic credentials such as passwords and connection strings, and 42 percent were specific, recognisable API keys.</desc>
<rect width="560" height="300" fill="#0A2434"/>
<text x="24" y="28" font-size="14" font-weight="600" fill="#FFFFFF">What leaked secrets look like</text>
<text x="24" y="46" font-size="11" fill="#B7CCD5">23.8 million secrets on public GitHub in 2024, by type</text>
<path d="M150.0,95.0 A80,80 0 1 1 111.5,245.1" fill="none" stroke="#8FAAB5" stroke-width="30"/>
<path d="M111.5,245.1 A80,80 0 0 1 150.0,95.0" fill="none" stroke="#3F6B7C" stroke-width="30"/>
<text x="150" y="173" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">58%</text>
<text x="150" y="191" font-size="11" text-anchor="middle" fill="#B7CCD5">generic</text>
<rect x="290" y="110" width="14" height="14" fill="#8FAAB5"/><text x="312" y="122" font-size="12" fill="#FFFFFF">Generic secrets · 58%</text>
<text x="312" y="140" font-size="11" fill="#B7CCD5">passwords, database strings, tokens</text>
<text x="312" y="155" font-size="11" fill="#B7CCD5">with no recognisable prefix</text>
<rect x="290" y="180" width="14" height="14" fill="#3F6B7C"/><text x="312" y="192" font-size="12" fill="#FFFFFF">Specific secrets · 42%</text>
<text x="312" y="210" font-size="11" fill="#B7CCD5">AWS, GitHub, Slack, Stripe and other</text>
<text x="312" y="225" font-size="11" fill="#B7CCD5">keys a pattern can name</text>
<text x="24" y="286" font-size="10" fill="#B7CCD5">Source: GitGuardian, State of Secrets Sprawl 2025 (March 2025)</text>
</svg>