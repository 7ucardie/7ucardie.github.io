<title id="c2t">Time for sitesdrop check by build size</title>
<desc id="c2d">Area chart. Checking a 1 megabyte build takes 0.21 seconds, 4 megabytes 0.74 seconds, 8 megabytes 1.30 seconds, 16 megabytes 1.40 seconds and 32 megabytes 1.57 seconds, measured on an Apple M5 Pro laptop, best of three runs, including zipping the folder.</desc>
