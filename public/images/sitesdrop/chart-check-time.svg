<line x1="70" x2="520" y1="97.4" y2="97.4" stroke="rgba(255,255,255,0.14)" stroke-width="1"/><text x="62" y="101.4" font-size="10" text-anchor="end" fill="#B7CCD5">1.5 s</text>
