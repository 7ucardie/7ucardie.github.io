<svg viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="c1t c1d" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,-apple-system,Segoe UI,sans-serif">
<title id="c1t">Bridge capital needed by stop age</title>
<desc id="c1d">Horizontal bar chart. Stopping at 60 needs about 310 thousand euro to bridge 96 months; at 62 about 226 thousand for 72 months; at 65 about 100 thousand for 36 months; at 67 years and 3 months about 10 thousand for 9 months.</desc>
<rect width="560" height="300" fill="#0A2434"/>
<text x="100" y="20" font-size="14" font-weight="600" fill="#FFFFFF">Bridge capital needed until the full pension at 68</text>
<text x="100" y="38" font-size="11" fill="#B7CCD5">Example: € 3.500/mo goal · AOW € 1.450 from 67y 3m · work pension € 2.200 from 68</text>
<line x1="100.0" x2="100.0" y1="52" y2="272" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
<text x="100.0" y="292" font-size="10" text-anchor="middle" fill="#B7CCD5">€ 0</text>
<line x1="185.0" x2="185.0" y1="52" y2="272" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="185.0" y="292" font-size="10" text-anchor="middle" fill="#B7CCD5">€ 100.000</text>
<line x1="270.0" x2="270.0" y1="52" y2="272" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="270.0" y="292" font-size="10" text-anchor="middle" fill="#B7CCD5">€ 200.000</text>
<line x1="355.0" x2="355.0" y1="52" y2="272" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="355.0" y="292" font-size="10" text-anchor="middle" fill="#B7CCD5">€ 300.000</text>
<line x1="440.0" x2="440.0" y1="52" y2="272" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="440.0" y="292" font-size="10" text-anchor="middle" fill="#B7CCD5">€ 400.000</text>
<text x="90" y="93.4" font-size="12" text-anchor="end" fill="#FFFFFF">stop at 60</text>
<path d="M100,78.4 h259.6 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-259.6 z" fill="#8FAAB5"/>
<text x="371.6" y="93.4" font-size="12" fill="#FFFFFF">€ 310.109 <tspan fill="#B7CCD5">· 96 mo</tspan></text>
<text x="90" y="141.8" font-size="12" text-anchor="end" fill="#FFFFFF">stop at 62</text>
<path d="M100,126.8 h188.2 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-188.2 z" fill="#8FAAB5"/>
<text x="300.2" y="141.8" font-size="12" fill="#FFFFFF">€ 226.109 <tspan fill="#B7CCD5">· 72 mo</tspan></text>
<text x="90" y="190.2" font-size="12" text-anchor="end" fill="#FFFFFF">stop at 65</text>
<path d="M100,175.2 h81.1 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-81.1 z" fill="#8FAAB5"/>
<text x="193.1" y="190.2" font-size="12" fill="#FFFFFF">€ 100.109 <tspan fill="#B7CCD5">· 36 mo</tspan></text>
<text x="90" y="238.6" font-size="12" text-anchor="end" fill="#FFFFFF">stop at 67y 3m</text>
<path d="M100,223.6 h4.9 a4,4 0 0 1 4,4 v14 a4,4 0 0 1 -4,4 h-4.9 z" fill="#8FAAB5"/>
<text x="116.9" y="238.6" font-size="12" fill="#FFFFFF">€ 10.469 <tspan fill="#B7CCD5">· 9 mo</tspan></text>
</svg>