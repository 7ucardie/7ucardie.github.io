<svg viewBox="0 0 560 300" width="560" height="300" role="img" aria-labelledby="c2t c2d" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,-apple-system,Segoe UI,sans-serif">
<title id="c2t">Monthly saving needed from today by stop age</title>
<desc id="c2d">Lollipop chart. To fully fund the bridge at a 3 percent return the example household would need to save about 907 euro per month to stop at 60, 596 to stop at 62, 229 to stop at 65 and 22 to stop at 67 years and 3 months.</desc>
<rect width="560" height="300" fill="#0A2434"/>
<text x="64" y="20" font-size="14" font-weight="600" fill="#FFFFFF">Monthly saving needed from today (age 40) to fund the bridge</text>
<text x="64" y="38" font-size="11" fill="#B7CCD5">Same example, savings earning 3% per year, contributions until the stop age</text>
<line x1="64" x2="536" y1="256.0" y2="256.0" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
<text x="56" y="260.0" font-size="10" text-anchor="end" fill="#B7CCD5">€ 0</text>
<line x1="64" x2="536" y1="188.0" y2="188.0" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="56" y="192.0" font-size="10" text-anchor="end" fill="#B7CCD5">€ 400</text>
<line x1="64" x2="536" y1="120.0" y2="120.0" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="56" y="124.0" font-size="10" text-anchor="end" fill="#B7CCD5">€ 800</text>
<line x1="64" x2="536" y1="52.0" y2="52.0" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="56" y="56.0" font-size="10" text-anchor="end" fill="#B7CCD5">€ 1.200</text>
<line x1="123.0" x2="123.0" y1="256" y2="101.8" stroke="#1BAF7A" stroke-width="2"/>
<circle cx="123.0" cy="101.8" r="6" fill="#1BAF7A"/>
<text x="123.0" y="89.8" font-size="12" text-anchor="middle" fill="#FFFFFF">€ 907/mo</text>
<text x="123.0" y="272" font-size="12" text-anchor="middle" fill="#FFFFFF">stop at 60</text>
<text x="123.0" y="286" font-size="10" text-anchor="middle" fill="#B7CCD5">19.1 yrs of saving</text>
<line x1="241.0" x2="241.0" y1="256" y2="154.7" stroke="#1BAF7A" stroke-width="2"/>
<circle cx="241.0" cy="154.7" r="6" fill="#1BAF7A"/>
<text x="241.0" y="142.7" font-size="12" text-anchor="middle" fill="#FFFFFF">€ 596/mo</text>
<text x="241.0" y="272" font-size="12" text-anchor="middle" fill="#FFFFFF">stop at 62</text>
<text x="241.0" y="286" font-size="10" text-anchor="middle" fill="#B7CCD5">21.1 yrs of saving</text>
<line x1="359.0" x2="359.0" y1="256" y2="217.1" stroke="#1BAF7A" stroke-width="2"/>
<circle cx="359.0" cy="217.1" r="6" fill="#1BAF7A"/>
<text x="359.0" y="205.1" font-size="12" text-anchor="middle" fill="#FFFFFF">€ 229/mo</text>
<text x="359.0" y="272" font-size="12" text-anchor="middle" fill="#FFFFFF">stop at 65</text>
<text x="359.0" y="286" font-size="10" text-anchor="middle" fill="#B7CCD5">24.1 yrs of saving</text>
<line x1="477.0" x2="477.0" y1="256" y2="252.3" stroke="#1BAF7A" stroke-width="2"/>
<circle cx="477.0" cy="252.3" r="6" fill="#1BAF7A"/>
<text x="477.0" y="240.3" font-size="12" text-anchor="middle" fill="#FFFFFF">€ 22/mo</text>
<text x="477.0" y="272" font-size="12" text-anchor="middle" fill="#FFFFFF">stop at 67y 3m</text>
<text x="477.0" y="286" font-size="10" text-anchor="middle" fill="#B7CCD5">26.3 yrs of saving</text>
</svg>