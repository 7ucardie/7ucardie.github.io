<svg viewBox="0 0 560 470" width="560" height="470" role="img" aria-labelledby="arct arcd" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,-apple-system,Segoe UI,sans-serif">
<title id="arct">How Trivium routes a prompt</title>
<desc id="arcd">Flow diagram. A prompt plus one sentence about the current repository goes to the router, semif with Qwen3.5-4B, which answers three questions: kind, difficulty and tools. A rules table picks a target; if the router is unsure it falls back to Claude Sonnet. The prompt then goes to one of three roads: the same local Qwen, Claude Code via claude --model, or Codex via codex -m. Every decision is appended to a log.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FAAB5"/></marker></defs>
<rect width="560" height="470" fill="#0A2434"/>
<text x="24" y="28" font-size="14" font-weight="600" fill="#FFFFFF">How Trivium routes a prompt</text>
<text x="24" y="46" font-size="11" fill="#B7CCD5">One command in front of three roads; nothing leaves the laptop until the target is chosen</text>

<rect x="130" y="64" width="300" height="52" rx="6" fill="#1F4959" stroke="#5C7C89"/>
<text x="280" y="86" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">ask "add retry to the http client"</text>
<text x="280" y="104" font-size="10.5" text-anchor="middle" fill="#B7CCD5">prompt + "typed inside the code repository 'trivium'"</text>
<line x1="280" y1="116" x2="280" y2="138" stroke="#8FAAB5" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="50" y="140" width="460" height="74" rx="6" fill="#1F4959" stroke="#9DC2D2"/>
<text x="280" y="162" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">Router: semif + Qwen3.5-4B on MLX</text>
<text x="280" y="181" font-size="10.5" text-anchor="middle" fill="#B7CCD5">one forward pass, a probability per option, no text generated</text>
<text x="280" y="201" font-size="10.5" text-anchor="middle" fill="#9DC2D2">kind: code_change 1.00 · difficulty: moderate 0.81 · tools: workspace 1.00</text>
<line x1="280" y1="214" x2="280" y2="236" stroke="#8FAAB5" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="90" y="238" width="380" height="56" rx="6" fill="#1F4959" stroke="#5C7C89"/>
<text x="280" y="260" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">Rules in targets.yaml, first match wins</text>
<text x="280" y="279" font-size="10.5" text-anchor="middle" fill="#B7CCD5">any answer below its threshold → fallback, Claude Sonnet 5</text>

<line x1="220" y1="294" x2="96" y2="330" stroke="#8FAAB5" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="280" y1="294" x2="280" y2="330" stroke="#8FAAB5" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="340" y1="294" x2="464" y2="330" stroke="#8FAAB5" stroke-width="1.5" marker-end="url(#arr)"/>

<rect x="24" y="332" width="160" height="64" rx="6" fill="#1F4959" stroke="#5C7C89"/>
<text x="104" y="354" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">Local Qwen3.5-4B</text>
<text x="104" y="372" font-size="10.5" text-anchor="middle" fill="#B7CCD5">same weights as the router</text>
<text x="104" y="387" font-size="10.5" text-anchor="middle" fill="#B7CCD5">trivial questions</text>

<rect x="200" y="332" width="160" height="64" rx="6" fill="#1F4959" stroke="#5C7C89"/>
<text x="280" y="354" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">Claude Code</text>
<text x="280" y="372" font-size="10.5" text-anchor="middle" fill="#B7CCD5">claude --model …</text>
<text x="280" y="387" font-size="10.5" text-anchor="middle" fill="#B7CCD5">Haiku · Sonnet · Opus · Fable</text>

<rect x="376" y="332" width="160" height="64" rx="6" fill="#1F4959" stroke="#9DC2D2" stroke-width="2"/>
<text x="456" y="354" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">Codex</text>
<text x="456" y="372" font-size="10.5" text-anchor="middle" fill="#B7CCD5">codex -m …</text>
<text x="456" y="387" font-size="10.5" text-anchor="middle" fill="#9DC2D2">gpt-6-sol ← this prompt</text>

<rect x="90" y="414" width="380" height="30" rx="6" fill="none" stroke="#5C7C89" stroke-dasharray="4 3"/>
<text x="280" y="433" font-size="10.5" text-anchor="middle" fill="#B7CCD5">every decision → decisions.jsonl, labelled later with ask rate</text>
<text x="24" y="462" font-size="10" fill="#B7CCD5">Trivium, github.com/7ucardie/trivium</text>
</svg>
